---
name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build and release
    runs-on: ${{ matrix.os }}
    needs:
      - test

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rpm_arch: x86_64

          - build: linux-arm
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE_NAME"

      - name: Get the release version from the tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux-only prerequisites
      - name: Install system deps (musl)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-dev musl-tools

      - name: Build zlib for musl
        if: contains(matrix.target, 'linux')
        run: |
          curl -fsSL https://zlib.net/fossils/zlib-1.3.1.tar.gz -o /tmp/zlib-1.3.1.tar.gz
          rm -rf /tmp/zlib-src /tmp/musl-zlib
          mkdir -p /tmp/zlib-src /tmp/musl-zlib
          tar -xf /tmp/zlib-1.3.1.tar.gz -C /tmp/zlib-src --strip-components=1
          (
            cd /tmp/zlib-src
            CC=musl-gcc ./configure --prefix=/tmp/musl-zlib --static
            make -j"$(nproc)"
            make install
          )
          TARGET_USCORE="$(echo '${{ matrix.target }}' | tr '-' '_')"
          {
            echo 'PKG_CONFIG_ALLOW_CROSS=1'
            echo 'PKG_CONFIG_PATH=/tmp/musl-zlib/lib/pkgconfig'
            echo "CFLAGS_${TARGET_USCORE}=-I/tmp/musl-zlib/include"
            echo 'LIBRARY_PATH=/tmp/musl-zlib/lib'
          } >> "$GITHUB_ENV"

      - name: Install packaging tools (RPM/DEB)
        if: contains(matrix.target, 'linux')
        run: |
          cargo install cargo-generate-rpm
          cargo install cargo-deb --force --locked

      # Build once for Linux (musl)
      - name: Build Linux (musl)
        if: contains(matrix.target, 'linux')
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Strip once and prep paths for both packagers
      - name: Strip and prepare packaging paths (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          BIN="target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}"
          ls -al "$BIN"
          strip -s "$BIN" || true
          # Ensure cargo-generate-rpm's asset path exists without copying the file
          mkdir -p target/release
          ln -sf "../${{ matrix.target }}/release/${{ steps.package.outputs.name }}" "target/release/${{ steps.package.outputs.name }}"
          ls -al target/release/${{ steps.package.outputs.name }}

      - name: Generate RPM
        if: contains(matrix.target, 'linux')
        run: |
          cargo generate-rpm --arch ${{ matrix.rpm_arch }}
          RPM_PATH="$(find target/generate-rpm -type f -name '*.rpm' -print -quit)"
          echo "RPM_ASSET=$RPM_PATH" >> $GITHUB_ENV
          echo "RPM: $RPM_PATH"

      - name: Generate DEB (musl static)
        if: contains(matrix.target, 'linux')
        run: |
          cargo deb --no-build --target ${{ matrix.target }}
          DEB_PATH="$(find target -type f -name '*.deb' -print -quit)"
          echo "DEB_ASSET=$DEB_PATH" >> $GITHUB_ENV
          echo "DEB: $DEB_PATH"

      # Non-Linux builds (macOS)
      - name: Build
        if: ${{ !contains(matrix.target, 'linux') }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          binary_name="${{ steps.package.outputs.name }}"
          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"

          mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"

          tar -czf "$dirname.tar.gz" "$dirname"
          echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV

      # Skip release if the tag starts with 't'
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 't')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          files: |-
            ${{ env.ASSET }}
            ${{ env.RPM_ASSET }}
            ${{ env.DEB_ASSET }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    # Only publish to crates.io on tag pushes that DON'T start with 't'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name,
      't')
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: cargo publish --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
