---
name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D clippy::all -D clippy::nursery
          -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check

  shell:
    name: Shell integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh

      - name: Build release binary
        run: cargo build --release --locked

      - name: Test shell integration
        run: ./test.sh

  test:
    name: Test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - macos-15-intel
        rust:
          - stable
    runs-on: ${{ matrix.os }}
    needs:
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: test
        run: cargo test

      - name: Build release binary
        run: cargo build --release --locked

      - name: Test Zsh loaders
        run: |
          zsh -dfi -c "source tests/slick_zsh_regression_test.zsh"
          zsh -dfi -c "source tests/load_zsh_regression_test.zsh"
